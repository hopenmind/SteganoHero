<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Refuses by name">
  <title>Refuses by name</title>
  <desc>Never a silent partial result. A refusal says what went wrong, and why.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F63D8"/><stop offset="1" stop-color="#ED30B3"/></linearGradient></defs>
  <rect x="2" y="2" width="356" height="236" rx="18" fill="#150C26" stroke="url(#g)" stroke-width="2"/>
  <rect x="24" y="22" width="52" height="4" rx="2" fill="url(#g)"/>
  <g transform="translate(180 42)">
    <circle cx="0" cy="26" r="23" fill="none" stroke="url(#g)" stroke-width="4"/>
    <line x1="-15.5" y1="10.5" x2="15.5" y2="41.5" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
    <rect x="-30" y="58" width="60" height="9" rx="4.5" fill="url(#g)"/>
  </g>
  <text x="180" y="150" text-anchor="middle" fill="#F1EEFF" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-weight="700" font-size="26">Refuses by name</text>
  <text x="180" y="182" text-anchor="middle" fill="#B7B0D8" font-family="'Segoe UI',system-ui,sans-serif" font-size="15">Never a silent partial result.</text>
  <text x="180" y="204" text-anchor="middle" fill="#B7B0D8" font-family="'Segoe UI',system-ui,sans-serif" font-size="15">A refusal says what, and why.</text>
</svg>
