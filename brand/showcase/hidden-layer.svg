<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Hidden layer">
  <title>Hidden layer</title>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F63D8"/><stop offset="1" stop-color="#ED30B3"/></linearGradient></defs>
  <rect x="2" y="2" width="356" height="236" rx="18" fill="#150C26" stroke="url(#g)" stroke-width="2"/>
  <rect x="24" y="22" width="52" height="4" rx="2" fill="url(#g)"/>
  <g transform="translate(150 44)" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="6" width="44" height="60" rx="6"/>
    <line x1="24" y1="22" x2="48" y2="22"/>
    <line x1="24" y1="50" x2="48" y2="50"/>
  </g>
  <g transform="translate(150 44)" fill="url(#g)">
    <circle cx="26" cy="36" r="2.6"/>
    <circle cx="34" cy="36" r="2.6"/>
    <circle cx="42" cy="36" r="2.6"/>
    <circle cx="50" cy="36" r="2.6"/>
  </g>
  <text x="180" y="150" text-anchor="middle" fill="#F1EEFF" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-weight="700" font-size="26">Hidden layer</text>
  <text x="180" y="182" text-anchor="middle" fill="#B7B0D8" font-family="'Segoe UI',system-ui,sans-serif" font-size="15">Place a secret inside ordinary text,</text>
  <text x="180" y="204" text-anchor="middle" fill="#B7B0D8" font-family="'Segoe UI',system-ui,sans-serif" font-size="15">invisible to a casual reader, and recover it.</text>
</svg>
