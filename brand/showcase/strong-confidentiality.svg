<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Strong confidentiality">
  <title>Strong confidentiality</title>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F63D8"/><stop offset="1" stop-color="#ED30B3"/></linearGradient></defs>
  <rect x="2" y="2" width="356" height="236" rx="18" fill="#150C26" stroke="url(#g)" stroke-width="2"/>
  <rect x="24" y="22" width="52" height="4" rx="2" fill="url(#g)"/>
  <g transform="translate(150 42)" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="30" width="40" height="34" rx="7"/>
    <path d="M23 30 v-9 a13 13 0 0 1 26 0 v9"/>
  </g>
  <g transform="translate(150 42)" fill="url(#g)">
