<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Honesty over hype">
  <title>Honesty over hype</title>
  <desc>Every result states what it can prove and names what it cannot.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F63D8"/><stop offset="1" stop-color="#ED30B3"/></linearGradient></defs>
  <rect x="2" y="2" width="356" height="236" rx="18" fill="#150C26" stroke="url(#g)" stroke-width="2"/>
  <rect x="24" y="22" width="52" height="4" rx="2" fill="url(#g)"/>
  <g transform="translate(180 44)" stroke-linecap="round" stroke-linejoin="round">
    <!-- what it can prove: a solid check -->
    <circle cx="-27" cy="30" r="21" fill="url(#g)"/>
    <path d="M-37 30 L-30 37 L-18 22" fill="none" stroke="#150C26" stroke-width="4.5"/>
    <!-- what it cannot: named, not hidden -->
    <circle cx="27" cy="30" r="21" fill="none" stroke="url(#g)" stroke-width="4"/>
    <line x1="17" y1="30" x2="37" y2="30" fill="none" stroke="url(#g)" stroke-width="4"/>
  </g>
  <text x="180" y="150" text-anchor="middle" fill="#F1EEFF" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-weight="700" font-size="26">Honesty over hype</text>
  <text x="180" y="182" text-anchor="middle" fill="#B7B0D8" font-family="'Segoe UI',system-ui,sans-serif" font-size="15">It states what it can prove,</text>
  <text x="180" y="204" text-anchor="middle" fill="#B7B0D8" font-family="'Segoe UI',system-ui,sans-serif" font-size="15">and names what it cannot.</text>
</svg>
