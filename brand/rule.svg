<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="1200" height="20" role="img" aria-label="section separator" preserveAspectRatio="none">
  <title>section separator</title>
  <defs>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6F63D8" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#6F63D8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ED30B3"/>
      <stop offset="0.72" stop-color="#6F63D8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6F63D8" stop-opacity="0"/>
