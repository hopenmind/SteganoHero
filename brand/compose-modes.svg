<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="Two ways to compose: Discreet and Resilient, with their trade-offs">
  <title>Two ways to compose</title>
  <desc>Discreet keeps the smallest footprint and fits a short cover; Resilient survives excerpting and partial damage at a larger footprint. The engine keeps its promise either way.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F63D8"/><stop offset="1" stop-color="#ED30B3"/></linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="857" height="357" rx="20" fill="#150C26" stroke="url(#g)" stroke-width="2"/>

  <text x="40" y="50" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#9B87FF">TWO WAYS TO COMPOSE</text>
  <text x="40" y="74" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" fill="#B7B0D8">Choose the footprint. The engine keeps its promise either way.</text>

  <!-- Discreet panel (default) -->
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <rect x="40" y="104" width="380" height="224" rx="14" fill="#211B33" stroke="url(#g)" stroke-width="1.5"/>

    <!-- default pill -->
    <rect x="300" y="122" width="102" height="26" rx="13" fill="url(#g)"/>
    <text x="351" y="139.5" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#150C26">DEFAULT</text>

    <!-- icon: cover with one small mark -->
    <g transform="translate(64 126)">
      <rect x="0" y="0" width="108" height="56" rx="8" fill="none" stroke="url(#g)" stroke-width="2.5"/>
      <line x1="16" y1="18" x2="70" y2="18" stroke="#4B3F73" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="30" x2="86" y2="30" stroke="#4B3F73" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="42" x2="58" y2="42" stroke="#4B3F73" stroke-width="3" stroke-linecap="round"/>
      <circle cx="52" cy="30" r="4.5" fill="url(#g)"/>
    </g>

    <text x="64" y="216" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="25" font-weight="700" fill="#F1EEFF">Discreet</text>
    <text x="64" y="240" font-size="14.5" fill="#B7B0D8">The lightest footprint.</text>

    <!-- advantage -->
    <g transform="translate(64 258)">
      <path d="M0 6 L4.5 11 L13 1.5" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="10" font-size="14" fill="#ECE8F4">Fits a short cover, the most invisible choice</text>
    </g>
    <!-- trade-off -->
    <g transform="translate(64 290)">
      <line x1="1" y1="6" x2="13" y2="6" stroke="#8A82A0" stroke-width="3" stroke-linecap="round"/>
      <text x="24" y="10" font-size="14" fill="#9A93B4">A heavily cut copy may not fully recover</text>
    </g>
  </g>

  <!-- Resilient panel (opt-in) -->
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <rect x="440" y="104" width="380" height="224" rx="14" fill="#211B33" stroke="url(#g)" stroke-width="1.5"/>

    <rect x="700" y="122" width="102" height="26" rx="13" fill="none" stroke="url(#g)" stroke-width="1.5"/>
    <text x="751" y="139.5" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#9B87FF">OPT-IN</text>

    <!-- icon: cover with repeated marks and a surviving fragment -->
    <g transform="translate(464 126)">
      <rect x="0" y="0" width="108" height="56" rx="8" fill="none" stroke="url(#g)" stroke-width="2.5"/>
      <line x1="16" y1="18" x2="70" y2="18" stroke="#4B3F73" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="30" x2="86" y2="30" stroke="#4B3F73" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="42" x2="58" y2="42" stroke="#4B3F73" stroke-width="3" stroke-linecap="round"/>
      <circle cx="28" cy="18" r="4" fill="url(#g)"/>
      <circle cx="52" cy="30" r="4" fill="url(#g)"/>
      <circle cx="40" cy="42" r="4" fill="url(#g)"/>
      <circle cx="76" cy="18" r="4" fill="url(#g)"/>
      <!-- cut line: a fragment still carries a mark -->
      <line x1="90" y1="-6" x2="90" y2="62" stroke="#ED30B3" stroke-width="1.6" stroke-dasharray="4 4"/>
      <circle cx="98" cy="30" r="4" fill="url(#g)"/>
    </g>

    <text x="464" y="216" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="25" font-weight="700" fill="#F1EEFF">Resilient</text>
    <text x="464" y="240" font-size="14.5" fill="#B7B0D8">Survives excerpting and damage.</text>

    <g transform="translate(464 258)">
      <path d="M0 6 L4.5 11 L13 1.5" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="10" font-size="14" fill="#ECE8F4">Recovers from a fragment of the text</text>
    </g>
    <g transform="translate(464 290)">
      <line x1="1" y1="6" x2="13" y2="6" stroke="#8A82A0" stroke-width="3" stroke-linecap="round"/>
      <text x="24" y="10" font-size="14" fill="#9A93B4">A larger footprint, needs more room</text>
    </g>
  </g>
</svg>
