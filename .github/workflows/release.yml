name: Release

# Build the desktop installers for Windows, Linux, and macOS (Apple Silicon and
# Intel) and attach them to a draft GitHub release. Triggered by pushing a
# version tag (for example v0.1.0), or run by hand from the Actions tab.
#
# Each installer is produced on its own native runner: a desktop app cannot be
# cross-built, so this is the route to all three platforms. The release is a
# DRAFT, so nothing is published until it is reviewed and released by hand.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/stegano-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "SteganoHero ${{ github.ref_name }}"
          releaseBody: "Desktop installers for Windows, Linux, and macOS. Download the one for your system."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
