<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="SteganoHero architecture">
  <title>SteganoHero architecture</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6F63D8"/><stop offset="1" stop-color="#ED30B3"/></linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F63D8"/><stop offset="1" stop-color="#ED30B3"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="920" height="470" rx="20" fill="#150C26"/>
  <text x="40" y="46" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#9B87FF">ARCHITECTURE</text>
  <text x="40" y="61" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#8A82A0">Four surfaces, one engine, no network at runtime.</text>

  <!-- Surfaces -->
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <g>
      <rect x="38" y="80" width="196" height="74" rx="12" fill="#211B33" stroke="url(#g)" stroke-width="1.5"/>
      <text x="56" y="112" font-size="15.5" font-weight="700" fill="#ECE8F4">Desktop app</text>
      <text x="56" y="133" font-size="12" fill="#A29AB4">native window</text>
    </g>
    <g>
      <rect x="254" y="80" width="196" height="74" rx="12" fill="#211B33" stroke="url(#g)" stroke-width="1.5"/>
      <text x="272" y="112" font-size="15.5" font-weight="700" fill="#ECE8F4">Command line</text>
      <text x="272" y="133" font-size="12" fill="#A29AB4">scripts and one-off jobs</text>
    </g>
    <g>
      <rect x="470" y="80" width="196" height="74" rx="12" fill="#211B33" stroke="url(#g)" stroke-width="1.5"/>
      <text x="488" y="112" font-size="15.5" font-weight="700" fill="#ECE8F4">MCP server</text>
      <text x="488" y="133" font-size="12" fill="#A29AB4">drive from an assistant</text>
    </g>
    <g>
      <rect x="686" y="80" width="196" height="74" rx="12" fill="#211B33" stroke="url(#g)" stroke-width="1.5"/>
      <text x="704" y="112" font-size="15.5" font-weight="700" fill="#ECE8F4">REST server</text>
      <text x="704" y="133" font-size="12" fill="#A29AB4">local HTTP</text>
    </g>
  </g>

  <!-- Connectors: surfaces to catalogue -->
  <g stroke="#4A3F6B" stroke-width="1.5">
    <line x1="136" y1="154" x2="136" y2="182"/>
    <line x1="352" y1="154" x2="352" y2="182"/>
    <line x1="568" y1="154" x2="568" y2="182"/>
    <line x1="784" y1="154" x2="784" y2="182"/>
  </g>

  <!-- Shared catalogue -->
  <rect x="38" y="182" width="844" height="46" rx="10" fill="url(#g)"/>
  <text x="460" y="210" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Shared command catalogue, one validated path, identical on every surface</text>

  <!-- Connectors: catalogue to engine -->
  <g stroke="#4A3F6B" stroke-width="1.5">
    <line x1="171" y1="228" x2="171" y2="256"/>
    <line x1="461" y1="228" x2="461" y2="256"/>
    <line x1="751" y1="228" x2="751" y2="256"/>
  </g>

  <!-- Engine crates -->
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <g>
      <rect x="38" y="256" width="266" height="150" rx="12" fill="#211B33" stroke="#6F63D8" stroke-width="1.5"/>
      <text x="58" y="284" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1" fill="#9B87FF">CORE ENGINE</text>
      <text x="58" y="312" font-size="15" font-weight="700" fill="#ECE8F4">The frozen engine</text>
      <text x="58" y="336" font-size="11.5" fill="#A29AB4">Marking and confidentiality,</text>
      <text x="58" y="353" font-size="11.5" fill="#A29AB4">forensic analysis, provenance</text>
      <text x="58" y="370" font-size="11.5" fill="#A29AB4">and signing, document</text>
      <text x="58" y="387" font-size="11.5" fill="#A29AB4">sovereignty.</text>
    </g>
    <g>
      <rect x="328" y="256" width="266" height="150" rx="12" fill="#211B33" stroke="#6F63D8" stroke-width="1.5"/>
      <text x="348" y="284" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1" fill="#9B87FF">FILE LAYER</text>
      <text x="348" y="312" font-size="15" font-weight="700" fill="#ECE8F4">Real documents</text>
      <text x="348" y="336" font-size="11.5" fill="#A29AB4">Read, clean, strip and pristine</text>
      <text x="348" y="353" font-size="11.5" fill="#A29AB4">documents across common</text>
      <text x="348" y="370" font-size="11.5" fill="#A29AB4">formats, and the text layer</text>
      <text x="348" y="387" font-size="11.5" fill="#A29AB4">of a PDF.</text>
    </g>
    <g>
      <rect x="618" y="256" width="266" height="150" rx="12" fill="#211B33" stroke="#6F63D8" stroke-width="1.5"/>
      <text x="638" y="284" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1" fill="#9B87FF">WORD-CHOICE ANALYSIS</text>
      <text x="638" y="312" font-size="15" font-weight="700" fill="#ECE8F4">AI-origin signals</text>
      <text x="638" y="336" font-size="11.5" fill="#A29AB4">Statistical signals under an</text>
      <text x="638" y="353" font-size="11.5" fill="#A29AB4">honest taxonomy: certain,</text>
      <text x="638" y="370" font-size="11.5" fill="#A29AB4">probable, or stated</text>
      <text x="638" y="387" font-size="11.5" fill="#A29AB4">impossible.</text>
    </g>
  </g>

  <text x="460" y="440" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#8A82A0">One self-contained Rust workspace. No external service, no network call at runtime.</text>
</svg>
