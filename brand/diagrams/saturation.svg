<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Saturation: fill the channel to the cover's full capacity">
  <title>Saturation fills the channel to the cover's capacity</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6F63D8"/><stop offset="1" stop-color="#ED30B3"/></linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F63D8"/><stop offset="1" stop-color="#ED30B3"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="820" height="300" rx="20" fill="#150C26"/>
  <text x="34" y="42" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#9B87FF">SATURATION</text>
  <text x="34" y="63" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#8A82A0">The aggressive variant. Fill the channel to the cover's full capacity, not to the secret.</text>

  <!-- Left: a single copy -->
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <rect x="34" y="86" width="360" height="120" rx="12" fill="#1E1733" stroke="#33294f" stroke-width="1"/>
    <text x="52" y="112" font-size="12.5" font-weight="700" fill="#C9C1E6">A single copy</text>
    <text x="52" y="130" font-size="11.5" fill="#8A82A0">the secret placed once, a light footprint</text>
    <!-- cover words with a few marks -->
    <g transform="translate(52 150)">
      <g fill="#3A3357">
        <rect x="0" y="0" width="30" height="9" rx="4"/><rect x="46" y="0" width="22" height="9" rx="4"/><rect x="86" y="0" width="34" height="9" rx="4"/><rect x="140" y="0" width="26" height="9" rx="4"/><rect x="186" y="0" width="38" height="9" rx="4"/><rect x="244" y="0" width="20" height="9" rx="4"/><rect x="286" y="0" width="30" height="9" rx="4"/>
        <rect x="0" y="20" width="26" height="9" rx="4"/><rect x="42" y="20" width="36" height="9" rx="4"/><rect x="96" y="20" width="24" height="9" rx="4"/><rect x="138" y="20" width="30" height="9" rx="4"/><rect x="186" y="20" width="22" height="9" rx="4"/><rect x="224" y="20" width="34" height="9" rx="4"/><rect x="276" y="20" width="40" height="9" rx="4"/>
      </g>
      <g fill="url(#gv)">
        <circle cx="38" cy="4.5" r="3"/><circle cx="176" cy="4.5" r="3"/><circle cx="276" cy="24.5" r="3"/>
      </g>
    </g>
    <text x="52" y="196" font-size="11" fill="#7C749A">a fraction of the positions used</text>
  </g>

  <!-- Right: saturated -->
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <rect x="426" y="86" width="360" height="120" rx="12" fill="#1E1733" stroke="url(#g)" stroke-width="1.5"/>
    <text x="444" y="112" font-size="12.5" font-weight="700" fill="#F1EEFF">Saturated</text>
    <text x="444" y="130" font-size="11.5" fill="#A29AB4">the secret repeated to fill every position</text>
    <g transform="translate(444 150)">
      <g fill="#3A3357">
        <rect x="0" y="0" width="30" height="9" rx="4"/><rect x="46" y="0" width="22" height="9" rx="4"/><rect x="86" y="0" width="34" height="9" rx="4"/><rect x="140" y="0" width="26" height="9" rx="4"/><rect x="186" y="0" width="38" height="9" rx="4"/><rect x="244" y="0" width="20" height="9" rx="4"/><rect x="286" y="0" width="30" height="9" rx="4"/>
        <rect x="0" y="20" width="26" height="9" rx="4"/><rect x="42" y="20" width="36" height="9" rx="4"/><rect x="96" y="20" width="24" height="9" rx="4"/><rect x="138" y="20" width="30" height="9" rx="4"/><rect x="186" y="20" width="22" height="9" rx="4"/><rect x="224" y="20" width="34" height="9" rx="4"/><rect x="276" y="20" width="40" height="9" rx="4"/>
      </g>
      <g fill="url(#gv)">
        <circle cx="38" cy="4.5" r="3"/><circle cx="76" cy="4.5" r="3"/><circle cx="128" cy="4.5" r="3"/><circle cx="172" cy="4.5" r="3"/><circle cx="230" cy="4.5" r="3"/><circle cx="272" cy="4.5" r="3"/><circle cx="322" cy="4.5" r="3"/>
        <circle cx="32" cy="24.5" r="3"/><circle cx="86" cy="24.5" r="3"/><circle cx="128" cy="24.5" r="3"/><circle cx="176" cy="24.5" r="3"/><circle cx="216" cy="24.5" r="3"/><circle cx="268" cy="24.5" r="3"/><circle cx="322" cy="24.5" r="3"/>
      </g>
    </g>
    <text x="444" y="196" font-size="11" fill="#C9C1E6">a hidden character at nearly every position</text>
  </g>

  <!-- Stats bar -->
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <rect x="34" y="224" width="752" height="52" rx="12" fill="#0F0920" stroke="#2A2142" stroke-width="1"/>
    <text x="60" y="248" font-size="22" font-weight="800" fill="url(#g)">94%</text>
    <text x="60" y="266" font-size="11" fill="#8A82A0">of the cover's capacity filled</text>
    <line x1="200" y1="236" x2="200" y2="264" stroke="#2A2142"/>
    <text x="226" y="248" font-size="13" font-weight="700" fill="#ECE8F4">Composes with the cipher</text>
    <text x="226" y="266" font-size="11" fill="#8A82A0">passphrase or recipient seal, applied first</text>
    <line x1="516" y1="236" x2="516" y2="264" stroke="#2A2142"/>
    <text x="542" y="248" font-size="13" font-weight="700" fill="#ECE8F4">Recovers from a fragment</text>
    <text x="542" y="266" font-size="11" fill="#8A82A0">one surviving copy is enough</text>
  </g>
</svg>
