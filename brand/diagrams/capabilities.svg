<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" role="img" aria-label="Capabilities: the command families and how many commands each holds">
  <title>Capabilities: command families</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6F63D8"/><stop offset="1" stop-color="#ED30B3"/></linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F63D8"/><stop offset="1" stop-color="#ED30B3"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="820" height="320" rx="20" fill="#150C26"/>
  <text x="34" y="42" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#9B87FF">CAPABILITIES</text>
  <text x="34" y="63" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#8A82A0">One catalogue, grouped into families. Every command that can refuse does so by name.</text>

  <g font-family="'Segoe UI',system-ui,sans-serif">
    <!-- row 1 -->
    <g transform="translate(34 84)">
      <rect width="245" height="66" rx="12" fill="#1E1733" stroke="url(#g)" stroke-width="1.3"/>
      <circle cx="26" cy="26" r="6" fill="url(#gv)"/>
      <text x="46" y="26" font-size="14" font-weight="700" fill="#ECE8F4">Mark and reveal</text>
      <text x="46" y="46" font-size="11.5" fill="#8A82A0">place and recover a hidden layer</text>
      <text x="222" y="30" text-anchor="end" font-size="18" font-weight="800" fill="url(#g)">6</text>
    </g>
    <g transform="translate(288 84)">
      <rect width="245" height="66" rx="12" fill="#1E1733" stroke="#33294f" stroke-width="1"/>
      <circle cx="26" cy="26" r="6" fill="url(#gv)"/>
      <text x="46" y="26" font-size="14" font-weight="700" fill="#ECE8F4">Recipient encryption</text>
      <text x="46" y="46" font-size="11.5" fill="#8A82A0">seal to a key, no shared password</text>
      <text x="222" y="30" text-anchor="end" font-size="18" font-weight="800" fill="url(#g)">3</text>
    </g>
    <g transform="translate(542 84)">
      <rect width="245" height="66" rx="12" fill="#1E1733" stroke="#33294f" stroke-width="1"/>
      <circle cx="26" cy="26" r="6" fill="url(#gv)"/>
      <text x="46" y="26" font-size="14" font-weight="700" fill="#ECE8F4">Forensic analysis</text>
      <text x="46" y="46" font-size="11.5" fill="#8A82A0">verdicts, scores, character-level</text>
      <text x="222" y="30" text-anchor="end" font-size="18" font-weight="800" fill="url(#g)">5</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(34 162)">
      <rect width="245" height="66" rx="12" fill="#1E1733" stroke="#33294f" stroke-width="1"/>
      <circle cx="26" cy="26" r="6" fill="url(#gv)"/>
      <text x="46" y="26" font-size="14" font-weight="700" fill="#ECE8F4">Traceability</text>
      <text x="46" y="46" font-size="11.5" fill="#8A82A0">one copy per recipient, then trace</text>
      <text x="222" y="30" text-anchor="end" font-size="18" font-weight="800" fill="url(#g)">3</text>
    </g>
    <g transform="translate(288 162)">
      <rect width="245" height="66" rx="12" fill="#1E1733" stroke="#33294f" stroke-width="1"/>
      <circle cx="26" cy="26" r="6" fill="url(#gv)"/>
      <text x="46" y="26" font-size="14" font-weight="700" fill="#ECE8F4">Provenance</text>
      <text x="46" y="46" font-size="11.5" fill="#8A82A0">sign authorship, verify a document</text>
      <text x="222" y="30" text-anchor="end" font-size="18" font-weight="800" fill="url(#g)">6</text>
    </g>
    <g transform="translate(542 162)">
      <rect width="245" height="66" rx="12" fill="#1E1733" stroke="#33294f" stroke-width="1"/>
      <circle cx="26" cy="26" r="6" fill="url(#gv)"/>
      <text x="46" y="26" font-size="14" font-weight="700" fill="#ECE8F4">Document sovereignty</text>
      <text x="46" y="46" font-size="11.5" fill="#8A82A0">inspect, clean, pristine your files</text>
      <text x="222" y="30" text-anchor="end" font-size="18" font-weight="800" fill="url(#g)">10</text>
    </g>
    <!-- row 3 -->
    <g transform="translate(34 240)">
      <rect width="245" height="66" rx="12" fill="#1E1733" stroke="#33294f" stroke-width="1"/>
      <circle cx="26" cy="26" r="6" fill="url(#gv)"/>
      <text x="46" y="26" font-size="14" font-weight="700" fill="#ECE8F4">AI-origin signals</text>
      <text x="46" y="46" font-size="11.5" fill="#8A82A0">word-choice, an honest verdict</text>
      <text x="222" y="30" text-anchor="end" font-size="18" font-weight="800" fill="url(#g)">4</text>
    </g>
    <g transform="translate(288 240)">
      <rect width="245" height="66" rx="12" fill="#1E1733" stroke="#33294f" stroke-width="1"/>
      <circle cx="26" cy="26" r="6" fill="url(#gv)"/>
      <text x="46" y="26" font-size="14" font-weight="700" fill="#ECE8F4">Payload shaping</text>
      <text x="46" y="46" font-size="11.5" fill="#8A82A0">protect, compress, attach</text>
      <text x="222" y="30" text-anchor="end" font-size="18" font-weight="800" fill="url(#g)">7</text>
    </g>
    <g transform="translate(542 240)">
      <rect width="245" height="66" rx="12" fill="#1E1733" stroke="#33294f" stroke-width="1"/>
      <circle cx="26" cy="26" r="6" fill="url(#gv)"/>
      <text x="46" y="26" font-size="14" font-weight="700" fill="#ECE8F4">Output and config</text>
      <text x="46" y="46" font-size="11.5" fill="#8A82A0">export any format, validated settings</text>
      <text x="222" y="30" text-anchor="end" font-size="18" font-weight="800" fill="url(#g)">3</text>
    </g>
  </g>
</svg>
