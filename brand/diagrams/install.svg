<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 236" width="820" height="236" role="img" aria-label="Install: self-contained installers for Windows, macOS and Linux">
  <title>Install</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6F63D8"/><stop offset="1" stop-color="#ED30B3"/></linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F63D8"/><stop offset="1" stop-color="#ED30B3"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="820" height="236" rx="20" fill="#150C26"/>
  <text x="34" y="42" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#9B87FF">INSTALL</text>
  <text x="34" y="63" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#8A82A0">Download one file and run it. Self-contained, every dependency embedded, fully offline.</text>

  <g font-family="'Segoe UI',system-ui,sans-serif">
    <!-- Windows -->
    <g transform="translate(34 84)">
      <rect width="245" height="118" rx="12" fill="#1E1733" stroke="url(#g)" stroke-width="1.4"/>
      <rect x="20" y="20" width="18" height="18" rx="3" fill="url(#gv)"/>
      <text x="48" y="34" font-size="15" font-weight="700" fill="#ECE8F4">Windows</text>
      <g font-size="12" fill="#B7B0D8">
        <rect x="20" y="52" width="205" height="26" rx="7" fill="#241B3C"/><text x="34" y="69">Installer  ·  x64-setup.exe</text>
        <rect x="20" y="82" width="205" height="26" rx="7" fill="#241B3C"/><text x="34" y="99">MSI  ·  x64_en-US.msi</text>
      </g>
    </g>
    <!-- macOS -->
    <g transform="translate(288 84)">
      <rect width="245" height="118" rx="12" fill="#1E1733" stroke="#33294f" stroke-width="1"/>
      <circle cx="29" cy="29" r="9" fill="url(#gv)"/>
      <text x="48" y="34" font-size="15" font-weight="700" fill="#ECE8F4">macOS</text>
      <g font-size="12" fill="#B7B0D8">
        <rect x="20" y="52" width="205" height="26" rx="7" fill="#241B3C"/><text x="34" y="69">Apple silicon  ·  aarch64.dmg</text>
        <rect x="20" y="82" width="205" height="26" rx="7" fill="#241B3C"/><text x="34" y="99">Intel  ·  x64.dmg</text>
      </g>
    </g>
    <!-- Linux -->
    <g transform="translate(542 84)">
      <rect width="245" height="118" rx="12" fill="#1E1733" stroke="#33294f" stroke-width="1"/>
      <circle cx="29" cy="29" r="9" fill="url(#gv)"/>
      <text x="48" y="34" font-size="15" font-weight="700" fill="#ECE8F4">Linux</text>
      <g font-size="12" fill="#B7B0D8">
        <rect x="20" y="52" width="205" height="20" rx="6" fill="#241B3C"/><text x="34" y="66">AppImage  ·  amd64</text>
        <rect x="20" y="76" width="100" height="20" rx="6" fill="#241B3C"/><text x="34" y="90">deb</text>
        <rect x="125" y="76" width="100" height="20" rx="6" fill="#241B3C"/><text x="139" y="90">rpm</text>
      </g>
    </g>
  </g>
</svg>
