<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-label="Any input, any output">
  <title>Any input, any output</title>
  <desc>Paste text or hand an operation a document; its text is read first. Any result exports to the format you choose.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F63D8"/><stop offset="1" stop-color="#ED30B3"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F63D8"/></marker>
  </defs>

  <rect x="1.5" y="1.5" width="857" height="317" rx="20" fill="#150C26" stroke="url(#g)" stroke-width="2"/>
  <text x="40" y="48" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#9B87FF">ANY INPUT, ANY OUTPUT</text>
  <text x="40" y="72" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" fill="#B7B0D8">Paste text or hand it a file. Save the result in the format you choose.</text>

  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#D9D3EC">
    <!-- input chips -->
    <g>
      <rect x="40" y="104" width="150" height="34" rx="8" fill="#211B33" stroke="#4B3F73" stroke-width="1.3"/><text x="60" y="126">Text you paste</text>
      <rect x="40" y="148" width="150" height="34" rx="8" fill="#211B33" stroke="#4B3F73" stroke-width="1.3"/><text x="60" y="170">Word, ODT, HTML</text>
      <rect x="40" y="192" width="150" height="34" rx="8" fill="#211B33" stroke="#4B3F73" stroke-width="1.3"/><text x="60" y="214">Markdown, PDF text</text>
      <rect x="40" y="236" width="150" height="34" rx="8" fill="#211B33" stroke="#4B3F73" stroke-width="1.3"/><text x="60" y="258" fill="#9A93B4">and many more</text>
    </g>

    <!-- input connectors to the engine -->
    <g fill="none" stroke="#6F63D8" stroke-width="1.6">
      <path d="M190 121 C250 121 250 165 306 165" marker-end="url(#ar)"/>
      <path d="M190 165 C240 165 250 168 306 170" marker-end="url(#ar)"/>
      <path d="M190 209 C240 209 250 175 306 175" marker-end="url(#ar)"/>
      <path d="M190 253 C250 253 250 180 306 180" marker-end="url(#ar)"/>
    </g>

    <!-- engine -->
    <rect x="308" y="132" width="244" height="76" rx="14" fill="#211B33" stroke="url(#g)" stroke-width="2"/>
    <text x="430" y="164" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-weight="700" font-size="19" fill="#F1EEFF">One engine</text>
    <text x="430" y="188" text-anchor="middle" font-size="13.5" fill="#B7B0D8">text is read first, then the work runs</text>

    <!-- output connectors -->
    <g fill="none" stroke="#ED30B3" stroke-width="1.6">
      <path d="M554 165 C610 165 610 121 670 121" marker-end="url(#ar)"/>
      <path d="M554 170 C610 168 620 165 670 165" marker-end="url(#ar)"/>
      <path d="M554 175 C620 175 610 209 670 209" marker-end="url(#ar)"/>
      <path d="M554 180 C610 180 610 253 670 253" marker-end="url(#ar)"/>
    </g>

    <!-- output chips -->
    <g>
      <rect x="670" y="104" width="150" height="34" rx="8" fill="#211B33" stroke="#4B3F73" stroke-width="1.3"/><text x="690" y="126">Markdown, HTML</text>
      <rect x="670" y="148" width="150" height="34" rx="8" fill="#211B33" stroke="#4B3F73" stroke-width="1.3"/><text x="690" y="170">LaTeX, RTF, Org</text>
      <rect x="670" y="192" width="150" height="34" rx="8" fill="#211B33" stroke="#4B3F73" stroke-width="1.3"/><text x="690" y="214">Native PDF</text>
      <rect x="670" y="236" width="150" height="34" rx="8" fill="#211B33" stroke="#4B3F73" stroke-width="1.3"/><text x="690" y="258" fill="#9A93B4">copy or download</text>
    </g>
  </g>
</svg>
