  <text x="180" y="150" text-anchor="middle" fill="#F1EEFF" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-weight="700" font-size="25">Strong confidentiality</text>
  <text x="180" y="182" text-anchor="middle" fill="#B7B0D8" font-family="'Segoe UI',system-ui,sans-serif" font-size="15">AES-256-GCM and ChaCha20-Poly1305,</text>
  <text x="180" y="204" text-anchor="middle" fill="#B7B0D8" font-family="'Segoe UI',system-ui,sans-serif" font-size="15">keys hardened with Argon2id.</text>
